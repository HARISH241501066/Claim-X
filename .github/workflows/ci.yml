name: CI

# No secrets are used: every outside service (LLM, AWS SNS) is mocked in the tests, and a guard in
# backend/tests/conftest.py makes any real network call fail.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Lint
        run: python -m ruff check backend
      - name: Tests with coverage
        run: python -m pytest --cov=backend --cov-report=term --cov-report=xml
      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t claim-x .
      - name: Start it with throwaway settings
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" > .ci-env
          echo "DEMO_PASSWORD=$(openssl rand -hex 8)" >> .ci-env
          docker run -d --name claimx -p 8000:8000 --env-file .ci-env claim-x
      - name: Wait until it is ready
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:8000/health | grep -q '"ready":true' && exit 0
            sleep 2
          done
          docker logs claimx
          exit 1
      - name: Check the web app and the API answer on the one address
        run: |
          curl -sf -H "Accept: text/html" localhost:8000/ | grep -q "<title>Claim-X</title>"
          curl -sf -H "Accept: text/html" localhost:8000/queue | grep -q "<title>Claim-X</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/queue)" = "401"
          . ./.ci-env
          TOKEN=$(curl -sf -X POST localhost:8000/auth/login -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$DEMO_PASSWORD\"}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8000/overview | grep -q '"cases":20'
      - name: Show the logs if something failed
        if: failure()
        run: docker logs claimx
